name: CD — Déploiement Production AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1  # <-- Ajusté sur ta région actuelle
  EKS_CLUSTER_NAME: digitrans-cm-cluster

jobs:
  deploy-production:
    name: Déploiement EKS Production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configuration AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion ECR
        id: login-ecr  # <-- Ajouté ici pour mapper correctement les outputs plus bas
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker images (fallback)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Si le CI n'a pas construit/pushé les images, on les build et push depuis ce runner
          for SERVICE in erp-service crm-service supply-chain-service bi-service; do
            echo "--- Processing $SERVICE ---"
            if [ -f services/$SERVICE/Dockerfile ]; then
              echo "Building $SERVICE image"
              cd services/$SERVICE
              docker build -t ${{ steps.login-ecr.outputs.registry }}/digitrans-cm/$SERVICE:$IMAGE_TAG \
                -t ${{ steps.login-ecr.outputs.registry }}/digitrans-cm/$SERVICE:latest .
              docker push ${{ steps.login-ecr.outputs.registry }}/digitrans-cm/$SERVICE:$IMAGE_TAG
              docker push ${{ steps.login-ecr.outputs.registry }}/digitrans-cm/$SERVICE:latest
              cd - > /dev/null
            else
              echo "No Dockerfile for $SERVICE — skipping build"
            fi
          done

      - name: Configuration kubectl pour EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Déploiement des microservices sur EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Mise à jour des images dans les déploiements Kubernetes
          for SERVICE in erp-service crm-service supply-chain-service bi-service; do
            kubectl set image deployment/$SERVICE \
              $SERVICE=${{ steps.login-ecr.outputs.registry }}/digitrans-cm/$SERVICE:$IMAGE_TAG \
              --namespace=production
          done

          # Attendre que le déploiement soit terminé
          for SERVICE in erp-service crm-service supply-chain-service bi-service; do
            kubectl rollout status deployment/$SERVICE \
              --namespace=production \
              --timeout=300s
          done

      - name: Vérification de la santé post-déploiement
        run: |
          sleep 30
          kubectl get pods --namespace=production
          kubectl get services --namespace=production

      - name: Notification succès
        if: success()
        run: |
          echo "Déploiement DIGITRANS-CM réussi — commit: ${{ github.sha }}"